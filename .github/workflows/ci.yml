name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Smoke test against the public API
        shell: bash
        run: |
          cargo build --quiet
          ./target/debug/pulsesend --version
          # A fake key must be refused by the real API: exit code 1, error on stderr.
          set +e
          ./target/debug/pulsesend whoami --api-key ps_test_000000000000000000000000 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" = 1
          grep -q invalid_api_key err.txt
